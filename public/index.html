<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161a">
  <title>Low-Poly Assets</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
</head>
<body>
  <header class="top">
    <a href="#" class="brand">Low-Poly Assets</a>
    <span id="count" class="muted"></span>
  </header>

  <main id="gallery" class="grid" aria-live="polite"></main>

  <section id="detail" hidden>
    <a href="#" class="back">← All models</a>
    <div class="detail-layout">
      <div class="viewer-wrap">
        <model-viewer id="viewer" camera-controls touch-action="pan-y" shadow-intensity="0.6"
          exposure="1.05" environment-image="neutral" interaction-prompt="none"></model-viewer>
        <button id="idMode" class="chip corner" aria-pressed="false">Material colors</button>
        <button id="clearSel" class="chip floating" hidden>Clear selection</button>
      </div>
      <div class="info">
        <h1 id="name"></h1>
        <p id="desc" class="muted"></p>
        <dl class="stats">
          <div><dt>Triangles</dt><dd id="tris"></dd></div>
          <div><dt>Size (m)</dt><dd id="size"></dd></div>
          <div><dt>Materials</dt><dd id="matCount"></dd></div>
        </dl>

        <h2>Materials <span class="muted small">tap one or more to highlight</span></h2>
        <ul id="materials" class="materials"></ul>

        <h2>Download</h2>
        <div class="downloads">
          <a id="dlFbx" class="btn primary" download>FBX <span class="small">Unity</span></a>
          <a id="dlGlb" class="btn" download>GLB <span class="small">glTF</span></a>
        </div>

        <h2>Add to your game</h2>
        <p class="muted small">Paste this into a Claude Code session on your game repo:</p>
        <pre id="prompt" class="prompt"></pre>
        <button id="copyPrompt" class="btn">Copy prompt</button>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
